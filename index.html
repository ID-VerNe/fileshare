<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件共享</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script type="text/javascript">
    (function () {
        const intervalTime = 10;
        function checkAndRemoveLink() {
            const links = document.querySelectorAll('a');
            let isRemoved = false;
            links.forEach(link => {
                if (link.href === "http://host.coms.su/" && link.innerText.includes("Host Provided By ShanHuYun Free Hosting")) {
                    link.parentNode.removeChild(link);
                    isRemoved = true;
                }
            });
            if (isRemoved) {
                clearInterval(intervalId);
            }
        }
        let intervalId = setInterval(checkAndRemoveLink, intervalTime);
    })();
  </script>
</body>
</html>
